name: CI

on:
  # main'ga push (va deploy) + har pull request tekshiruvi. Boshqa branch'larga push — PR orqali.
  push:
    branches: [main]
  pull_request:

# Eng kam huquq: faqat kodni o'qish (deploy — Cloudflare tokeni bilan, GitHub huquqi kerak emas)
# Action'lar commit SHA bilan qotirilgan (teg ko'chirilsa ham kod o'zgarmaydi); izohda — versiya.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:sql
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
      # Edge Functions (Deno): index.ts va Deno'ga xos _shared fayllari tsc'da tekshirilmaydi.
      # Versiya aniq qotirilgan — yangi Deno chiqishi CI'ni kutilmaganda buzmasin.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Deno check (Edge Functions)
        working-directory: supabase/functions
        run: deno check */index.ts

  # Faqat main'ga push bo'lganda, tekshiruvlar o'tgandan keyin va Cloudflare sozlangan bo'lsa
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # GitHub Environment: Cloudflare sirlari shu yerda saqlanishi va himoya qoidalari (faqat main,
    # ixtiyoriy tasdiqlovchi) qo'yilishi mumkin. CLOUDFLARE_DEPLOY — repo darajasidagi o'zgaruvchi
    # bo'lib qoladi (job `if` environment'dan oldin hisoblanadi).
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Faqat ochiq (public) qiymatlar. service_role va bot tokeni bu yerga qo'yilmaydi
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
      VITE_APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Bo'sh VITE_ o'zgaruvchi bilan yig'ilgan frontend production'da ishlamaydi — deploy'dan oldin to'xtaymiz
      - name: Guard — majburiy VITE_ o'zgaruvchilar
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_TELEGRAM_BOT_USERNAME VITE_APP_VERSION; do
            if [ -z "${!name}" ]; then
              echo "::error::$name bo'sh (GitHub → Settings → Secrets and variables → Actions → Variables)"
              missing=1
            fi
          done
          case "$VITE_SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::VITE_SUPABASE_URL https:// bilan boshlanishi kerak"; missing=1 ;;
          esac
          exit $missing
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
